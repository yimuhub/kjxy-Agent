name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: techyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d techyard"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://app_user:ci-password@localhost:5432/techyard
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      APP_SECRET_KEY: ci-secret-key-for-tests-only-min-32-chars
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -e "..[dev]"
      - name: Migrations on clean database
        run: |
          cd backend
          alembic upgrade head
      - name: Version consistency
        run: python scripts/check_versions.py
      - name: UI standards (centered dialogs / resizable tables)
        run: python scripts/check_ui_standards.py
      - name: Lint
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        run: |
          cd backend
          mypy app
      - name: Unit and security tests
        run: |
          cd backend
          python -m pytest tests -q
      - name: Migration chain reversible
        run: |
          cd backend
          alembic downgrade -1
          alembic upgrade head
      - name: OpenAPI contract drift check
        run: |
          python backend/scripts/generate_openapi.py
          git diff --exit-code contracts/openapi.yaml

  # 本机语音转写（v3.30）：同一份 ONNX 模型在三端都要能装、能跑、能删。
  # 模型不进安装包，这里用 actions/cache 缓存下载结果（key=校验和，换了模型会自动失效）。
  asr-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ASR_MODEL_DIR: ${{ github.workspace }}/.asr-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.asr-models
          key: asr-paraformer-zh-small-3ef6c193-${{ runner.os }}
      - name: ASR smoke（下载→识别→删除）
        shell: bash
        run: python backend/scripts/asr_smoke.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Unit tests
        run: |
          cd frontend
          npm run test:unit
      - name: Type check and build
        run: |
          cd frontend
          npm run build

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (base + production overlay)
        run: |
          cp backend/.env.example .env
          API_IMAGE=ci-api WORKER_IMAGE=ci-worker WEB_IMAGE=ci-web \
            POSTGRES_PASSWORD=ci-password REDIS_PASSWORD=ci-password \
            docker compose -f compose.yaml -f compose.production.yaml config >/dev/null
          rm -f .env

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f deploy/docker/api.Dockerfile -t techyard-api:ci .
      - name: Build worker image
        run: docker build -f deploy/docker/worker.Dockerfile -t techyard-worker:ci .
      - name: Build web image
        run: docker build -f deploy/docker/web.Dockerfile -t techyard-web:ci .
