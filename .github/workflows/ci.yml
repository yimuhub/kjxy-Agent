name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: techyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d techyard"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://app_user:ci-password@localhost:5432/techyard
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      APP_SECRET_KEY: ci-secret-key-for-tests-only-min-32-chars
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -e "..[dev]"
      - name: Lint
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        run: |
          cd backend
          mypy app
      - name: Unit and security tests
        run: |
          cd backend
          python -m pytest tests -q
      - name: Migrations on clean database
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: OpenAPI contract drift check
        run: |
          python backend/scripts/generate_openapi.py
          git diff --exit-code contracts/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Type check and build
        run: |
          cd frontend
          npm run build
