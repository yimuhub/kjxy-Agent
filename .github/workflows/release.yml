# 正式发布流水线：推 v* 标签 → 三平台构建签名安装包 → 上传 GitHub Release（含更新包 .sig 与 latest.json）
# 客户端 plugins.updater 指向本仓库 Releases 的 latest.json，实现应用内自动升级（见 client/desktop/README.md）。
#
# 必须在仓库 Settings → Secrets and variables → Actions 配置：
#   TAURI_SIGNING_PRIVATE_KEY          = updater 私钥文件完整内容
#                                        （本机路径：Documents/Hermes/kjxy-work/tauri_updater_private_key，绝不提交进仓库）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 与私钥匹配的口令（只存 Secrets，不写入仓库）
#   GITHUB_TOKEN 用工作流自带 token（下方 permissions 已给 contents: write，用于建 Release）
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches every version surface
        run: python scripts/check_versions.py --tag "${GITHUB_REF_NAME}"

  # 发布前置门禁（审查 O4）：release 不再只校验版本号，必须先在打标签的 commit 上
  # 跑通与 CI 同口径的后端/前端门禁，否则不进入三平台构建。
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: techyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d techyard"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://app_user:ci-password@localhost:5432/techyard
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      APP_SECRET_KEY: ci-secret-key-for-tests-only-min-32-chars
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: mock
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Backend dependencies (frozen lock)
        run: uv sync --frozen --extra dev
      - name: Migrations clean + reversible
        run: |
          cd backend
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: Lint / type / tests
        run: |
          cd backend
          uv run ruff check app tests
          uv run ruff format --check app tests
          uv run mypy app
          uv run python -m pytest tests -q
      - name: Contract drift
        run: |
          uv run python backend/scripts/generate_openapi.py
          git diff --exit-code contracts/openapi.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend gates
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run test:unit
          npm run build

  release:
    needs: [verify, quality-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            # updater 升级包来自 app bundle（.app.tar.gz + .sig），dmg 供手动首装
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            # Intel Mac 原生包：sidecar 需同架构 PyInstaller 产物，故用 Intel runner 而非交叉编译
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # offlineInstaller：NSIS 内嵌 WebView2 离线安装器（+127MB），装包全程不需要联网
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # deb 装到系统；AppImage 免安装双击即用，且是 Linux 自动升级所用格式
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      UV_FROZEN: "1"
    steps:
      # —— 以下步骤链复用 client.yml 已实测的模式 ——
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            client/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build web frontend -> dist-web
        shell: bash
        run: |
          cd frontend && npm ci && npm run build
          mkdir -p ../client/desktop/dist-web
          cp -r dist/* ../client/desktop/dist-web/
          # 引擎托管的前端资源（bundle.resources: frontend-dist/**/*，build.rs 校验非空 glob）
          mkdir -p ../client/desktop/src-tauri/frontend-dist
          cp -r dist/* ../client/desktop/src-tauri/frontend-dist/
      - name: Build PyInstaller sidecar（本地引擎）
        shell: bash
        run: |
          # 依赖必须来自 uv.lock（不再临时 pip 解析），否则三平台产物依赖不可复现
          uv sync --frozen --extra dev
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="$(pwd)/.venv/Scripts/python.exe"
          else
            PY="$(pwd)/.venv/bin/python"
          fi
          uv pip install --python "$PY" pyinstaller
          PYTHON="$PY" bash backend/scripts/build_sidecar.sh
          ls -la backend/dist
      - name: Stage sidecar binary (tauri target-triple naming)
        shell: bash
        run: |
          mkdir -p client/desktop/src-tauri/binaries
          SRC=$(ls backend/dist/techyard-sidecar* | head -1)
          EXT=$([ "${{ runner.os }}" = "Windows" ] && echo ".exe" || echo "")
          cp "$SRC" "client/desktop/src-tauri/binaries/techyard-sidecar-${{ matrix.target }}${EXT}"
      - name: Generate app icons
        working-directory: client/desktop
        shell: bash
        run: |
          npm ci
          npx tauri icon icons-src/app-icon.png
      # 签名 + 打包 + 建 Release + 上传产物（安装包、.sig）。
      # latest.json 不在这一步生成：productName 是中文，GitHub 上传资产会剥掉非 ASCII 字符，
      # tauri-action 按 productName 匹配不到 .sig 就静默跳过（日志：Signature not found for the updater JSON）。
      # 交由下方 updater-json 作业按真实资产名单点重建，顺带避免三个并行作业互相覆盖。
      - name: Tauri build + sign + upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 缺这两个 secret 时签名直接失败——正式发布必须配置（见文件头注释）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # 与推送的标签同名：Release 即更新通道，latest.json 放该 Release 供 updater 拉取
          tagName: ${{ github.ref_name }}
          releaseName: 科技小院 ${{ github.ref_name }}
          releaseBody: 自动构建：macOS(aarch64/x86_64 dmg) / Windows(NSIS，内嵌 WebView2 离线安装器) / Linux(deb + AppImage)，含自动升级更新包与签名。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

  # 发布门禁：草稿里的 macOS 包签名必须有效，才生成 latest.json 并转为公开。
  # v3.73.3 事故：tauri-action 产出的 .app 只有链接器临时签名（没有 _CodeSignature），
  # 用户端 Gatekeeper 直接报「已损坏」。这里在 macOS runner 上真挂载 dmg 验一遍。
  publish:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS dmg from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$REPO" --pattern '*.dmg' --dir dist
          ls -lh dist
      - name: Verify macOS bundle signature inside dmg
        run: |
          set -euo pipefail
          for DMG in dist/*.dmg; do
            echo "== $DMG"
            MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF; exit}')
            [ -n "$MNT" ] || { echo "挂载失败：$DMG"; exit 1; }
            APP=$(ls -d "$MNT"/*.app | head -1)
            if [ -z "$APP" ]; then hdiutil detach "$MNT" -quiet; echo "未找到 .app"; exit 1; fi
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv "$APP" 2>&1 | tee /tmp/codesign.txt
            grep -q "Signature=adhoc" /tmp/codesign.txt || { hdiutil detach "$MNT" -quiet; echo "缺少 ad-hoc 签名"; exit 1; }
            grep -q "Identifier=cn.techyard.desktop" /tmp/codesign.txt || { hdiutil detach "$MNT" -quiet; echo "Bundle Identifier 未绑定"; exit 1; }
            hdiutil detach "$MNT" -quiet
          done
      - name: Compose latest.json from release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          tag, repo = os.environ["TAG"], os.environ["REPO"]
          release = json.loads(
              subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
                  check=True, capture_output=True, text=True,
              ).stdout
          )
          assets = release["assets"]

          def find(suffixes):
              for asset in assets:
                  name = asset["name"]
                  if name.endswith(".sig"):
                      continue
                  if name.endswith(suffixes):
                      return asset
              return None

          def sig_text(bundle):
              for asset in assets:
                  if asset["name"] == f"{bundle['name']}.sig":
                      request = urllib.request.Request(
                          asset["url"],
                          headers={
                              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                              "Accept": "application/octet-stream",
                          },
                      )
                      with urllib.request.urlopen(request) as response:
                          return response.read().decode()
              return None

          specs = [
              ("darwin-aarch64", ("aarch64.app.tar.gz",)),
              ("darwin-x86_64", ("x86_64.app.tar.gz", "x64.app.tar.gz")),
              ("windows-x86_64", ("x64-setup.exe",)),
              # Tauri v2 的 Linux 更新包就是 AppImage 本体（配 .AppImage.sig）；
              # 老版本 tauri-action 才会额外产 .AppImage.tar.gz，两者都兼容
              ("linux-x86_64", ("amd64.AppImage.tar.gz", "amd64.AppImage")),
          ]
          platforms = {}
          for key, suffixes in specs:
              bundle = find(suffixes)
              if bundle is None:
                  print(f"skip {key}: update bundle not found")
                  continue
              signature = sig_text(bundle)
              if not signature:
                  print(f"skip {key}: signature not found")
                  continue
              platforms[key] = {
                  "signature": signature,
                  "url": bundle["browser_download_url"],
              }

          if not platforms:
              raise SystemExit("no updatable platform found, refusing to write latest.json")

          doc = {
              "version": tag.lstrip("v"),
              "notes": f"科技小院 {tag}",
              "pub_date": subprocess.run(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"],
                  check=True, capture_output=True, text=True,
              ).stdout.strip(),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(doc, handle, ensure_ascii=False, indent=2)
          print(json.dumps(platforms, ensure_ascii=False, indent=2))
          PY
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false
