# 生产覆盖配置：固定镜像标签、资源限制、不挂载源码、更严格的重启策略
# 用法：docker compose -f compose.yaml -f compose.production.yaml up -d
name: tech-yard-platform-prod

services:
  migrate:
    image: ${API_IMAGE:?请设置 API_IMAGE 为固定版本镜像标签，禁止 latest}
    build: !reset null
    restart: "no"

  api:
    image: ${API_IMAGE:?请设置 API_IMAGE 为固定版本镜像标签，禁止 latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      APP_ENV: production
      # redis 开启 requirepass 后，所有服务必须带凭证连接（整改修正：此前生产会连不上）
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

  worker:
    image: ${WORKER_IMAGE:?请设置 WORKER_IMAGE 为固定版本镜像标签，禁止 latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    environment:
      APP_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

  web:
    image: ${WEB_IMAGE:?请设置 WEB_IMAGE 为固定版本镜像标签，禁止 latest}
    build: !reset null
    restart: always

  postgres:
    restart: always
    environment:
      # 生产强制独立强密码（基础 compose 的 change-me 兜底在生产被此处覆盖为必填）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 4G

  scheduler:
    # 生产默认启用周期任务（超时回收/心跳/月度重置）；老版本 compose 不支持 !reset 时，
    # 请以 COMPOSE_PROFILES=scheduler 启动
    image: ${WORKER_IMAGE:?请设置 WORKER_IMAGE 为固定版本镜像标签，禁止 latest}
    build: !reset null
    profiles: !reset []
    environment:
      APP_ENV: production
      # 基础 compose 的 scheduler 固定了无密码 broker；生产 redis 开启 requirepass 后
      # 必须在这里补齐，否则 beat 连不上 broker（审查 O1）。
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    environment:
      # 容器内健康检查需要凭证；compose 插值不会自动注入容器环境（审查 O1）
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
