# =============================================================================
# 科技小院平台 · 生产单机 Compose（自包含，不叠加 compose.yaml）
#
# 用法（仓库根目录）：
#   cp .env.production.example .env.production   # 按注释填写真实值
#   docker compose --env-file .env.production -f docker-compose.prod.yaml up -d --build
#
# 约定（与 deploy/docker/*.Dockerfile、deploy/scripts/backup.sh 对齐）：
# - 构建上下文必须是仓库根（Dockerfile 里 COPY backend/ 与 frontend/）；
# - 密钥/密码全部来自 .env.production， compose 层做必填校验（:? 缺失即拒启）；
# - 数据库 pgvector/pgvector:pg17（检索模块依赖向量扩展），Redis 7 带密码；
# - web 复用 web.Dockerfile（内置 nginx），并按本任务要求把
#   deploy/nginx/default.conf 显式挂载进去（宿主机改反代配置无需重建镜像）；
# - 数据卷：pg（数据库）、redis（AOF）、files（上传件）——备份用
#   deploy/scripts/backup.sh，COMPOSE 变量传本文件的 compose 命令即可。
# =============================================================================
name: tech-yard-platform-prod-standalone

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: techyard
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d techyard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    environment:
      # compose 插值变量不等于容器环境变量：健康检查在容器内执行，
      # 必须显式注入，否则 redis-cli 无凭证 → NOAUTH → api 依赖 healthy 被阻断（审查 O1）。
      # REDISCLI_AUTH 让 redis-cli 自动读取，避免密码出现在进程参数里。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app_user:${POSTGRES_PASSWORD}@postgres:5432/techyard
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app_user:${POSTGRES_PASSWORD}@postgres:5432/techyard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      LOCAL_STORAGE_PATH: /data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 默认不对宿主暴露端口：公网入口统一走 web(nginx) 反代 /api/。
    # 需要本机调试时临时取消注释：
    # ports:
    #   - "127.0.0.1:8000:8000"
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app_user:${POSTGRES_PASSWORD}@postgres:5432/techyard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      LOCAL_STORAGE_PATH: /data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app_user:${POSTGRES_PASSWORD}@postgres:5432/techyard
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    volumes:
      # 按任务要求：宿主机 nginx 配置直接挂载（改反代不用重建镜像）
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  pg:
  redis:
  files:
