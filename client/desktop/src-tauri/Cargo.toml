[package]
name = "techyard-desktop"
version = "3.16.0"
description = "科技小院桌面壳：本地引擎 sidecar + splash + 级联退出（Tauri 2）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "techyard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 自动升级：GitHub Releases 通道（latest.json + minisign 验签），见 README「升级链路」
tauri-plugin-updater = "2"
# blocking 模式在独立线程轮询 health，不引入 tokio 到主线程心智负担
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[features]
custom-protocol = ["tauri/custom-protocol"]
