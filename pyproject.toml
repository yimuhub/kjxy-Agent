[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-yard-platform"
version = "3.36.2"
description = "科技小院多智能体自生长开发平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.118",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.3,<0.4",
    "redis>=5.0,<6",
    "celery[redis]>=5.4,<5.6",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<5",
    "httpx>=0.27,<0.29",
    # IM 机器人长连接（企微 aibot / 钉钉 Stream 出向 WebSocket）；
    # 版本下限取现网实测 17.x，与 uvicorn[standard] 传递依赖兼容
    "websockets>=13,<17.3",
    "python-multipart>=0.0.18,<0.0.20",
    "pypdf>=4.2,<6",
    "python-docx>=1.1,<2",
    "jsonschema>=4.22,<5",
    "cryptography>=42,<46",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "sherpa-onnx>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<0.8",
    "mypy>=1.11,<2",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() 作为参数默认值的标准写法

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "backend/app"
