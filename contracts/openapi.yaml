components:
  schemas:
    AgentGeneratePreviewRequest:
      properties:
        utterance:
          type: string
          maxLength: 2000
          minLength: 1
          title: Utterance
      additionalProperties: false
      type: object
      required:
      - utterance
      title: AgentGeneratePreviewRequest
    AgentGenerateRequest:
      properties:
        utterance:
          type: string
          maxLength: 2000
          minLength: 1
          title: Utterance
        visibility:
          type: string
          maxLength: 10
          title: Visibility
          default: private
        use_web:
          type: boolean
          title: Use Web
          default: true
        supplier_id:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: Supplier Id
      additionalProperties: false
      type: object
      required:
      - utterance
      title: AgentGenerateRequest
    AgentRunRequest:
      properties:
        input:
          additionalProperties: true
          type: object
          title: Input
          description: Agent 输入（各 Agent 的 input schema）
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
          description: 可选：关联任务 ID，不传则自动生成
      type: object
      title: AgentRunRequest
    AlertCreate:
      properties:
        title:
          type: string
          maxLength: 160
          minLength: 1
          title: Title
        detail:
          type: string
          maxLength: 4000
          title: Detail
          default: ''
        severity:
          type: string
          title: Severity
          description: low|normal|high|critical
          default: normal
        source:
          type: string
          maxLength: 32
          title: Source
          default: manual
        plot_id:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: Plot Id
      type: object
      required:
      - title
      title: AlertCreate
    ApplicationDraftCreate:
      properties:
        applicant_name:
          type: string
          minLength: 1
          title: Applicant Name
        applicant_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Type
        contact_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Contact Info
        form_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Form Data
      type: object
      required:
      - applicant_name
      title: ApplicationDraftCreate
      description: 生成申报材料草案的请求体。
    ApprovalDecisionRequest:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      type: object
      title: ApprovalDecisionRequest
    BatchAddMembersRequest:
      properties:
        members:
          items:
            $ref: '#/components/schemas/BatchMemberItem'
          type: array
          maxItems: 100
          minItems: 1
          title: Members
      type: object
      required:
      - members
      title: BatchAddMembersRequest
      description: 批量添加已有账号为成员；逐条独立成败，单条失败不影响其余。
    BatchMemberItem:
      properties:
        username:
