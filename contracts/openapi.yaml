    ConnectorConfigIn:
      properties:
        url:
          type: string
          maxLength: 500
          minLength: 8
          title: Url
        method:
          type: string
          enum:
          - GET
          - POST
          title: Method
          default: GET
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: 鉴权头（如 Authorization/X-Api-Key），入库加密
        body_template:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Body Template
          description: POST 时的 JSON 请求体
        interval_seconds:
          type: integer
          maximum: 86400.0
          minimum: 60.0
          title: Interval Seconds
          default: 300
        json_path:
          type: string
          title: Json Path
          description: 取数路径（点分 + [*]，如 $.data.items[*] 或 $.temp）；缺省取整个响应
          default: $
        field_map:
          additionalProperties:
            $ref: '#/components/schemas/FieldMapEntry'
          type: object
          minProperties: 1
          title: Field Map
          description: 厂商字段(支持点分路径) → 统一指标
        timeout_seconds:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Timeout Seconds
          default: 10
        time_field:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Field
          description: 记录内时间戳字段名（ISO8601），可选
      type: object
      required:
      - url
      - field_map
      title: ConnectorConfigIn
      description: 自定义连接器配置（写入形态；headers 值为明文，入库即 Fernet 加密）。
