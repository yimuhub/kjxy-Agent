components:
  schemas:
    AddMemberRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          title: Username
        role:
          type: string
          title: Role
          description: tenant_admin|expert|operator|viewer|service_worker
        display_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Display Name
      type: object
      required:
      - username
      - role
      title: AddMemberRequest
    AgentRunRequest:
      properties:
        input:
          additionalProperties: true
          type: object
          title: Input
          description: Agent 输入（各 Agent 的 input schema）
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
          description: 可选：关联任务 ID，不传则自动生成
      type: object
      title: AgentRunRequest
    ApplicationDraftCreate:
      properties:
        applicant_name:
          type: string
          minLength: 1
          title: Applicant Name
        applicant_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Type
        contact_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Contact Info
        form_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Form Data
      type: object
      required:
      - applicant_name
      title: ApplicationDraftCreate
      description: 生成申报材料草案的请求体。
    ApprovalDecisionRequest:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      type: object
      title: ApprovalDecisionRequest
    Body_upload_document_api_v1_knowledge_documents_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      title: Body_upload_document_api_v1_knowledge_documents_post
    CandidateBatchReview:
      properties:
        ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          title: Ids
          description: 候选 ID 列表（1-100 条）
        action:
          type: string
          enum:
          - approve
          - reject
          title: Action
        review_note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Review Note
      type: object
      required:
      - ids
      - action
      title: CandidateBatchReview
      description: 批量审核请求：逐条执行单条审核动作，单条失败不影响其余。
    CandidateReview:
      properties:
        action:
          type: string
          enum:
          - approve
