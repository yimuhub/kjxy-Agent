  /api/v1/tasks/{task_id}/events/stream:
    get:
      tags:
      - v1
      - tasks
      summary: Stream Task Events
      description: "SSE 任务事件流（text/event-stream）。\n\n- 权限与 GET /{task_id}/events 完全一致：同一 get_yard_context 依赖 +\n  TaskService.get\
        \ 可见性检查（阅读本文前先检查，失败按普通 JSON 错误返回）。\n- 本端点不套统一 {data, request_id} 信封：SSE 帧由 event:/data: 行构成，\n  帧协议与命名见 stream.py\
        \ 模块注释（stream-init/task-event/task-status/stream-end）。\n- 支持 Last-Event-ID 重连续传，并以注释帧心跳保活。\n- 断连仅停止推送，任务继续执行；取消仍须显式调用\
        \ POST /{task_id}/cancel。"
      operationId: stream_task_events_api_v1_tasks__task_id__events_stream_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
